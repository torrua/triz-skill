name: CI & Release Verification

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Test Suite & Parity (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Portable Source Unit Test Suite
        run: python tests/test_triz_skill.py

      - name: Verify Cross-Platform Deployment Sync & Active Deployment Tests
        shell: bash
        run: |
          DEPLOY_TMP="$(mktemp -d)/triz-universal"
          python scripts/sync_deployment.py --mode apply --destination "$DEPLOY_TMP"
          python scripts/sync_deployment.py --mode check --destination "$DEPLOY_TMP"
          TRIZ_DEPLOY_DIR="$DEPLOY_TMP" python tests/test_triz_skill.py

      - name: Run Trigger, Rubric & Token Budget Evaluation Suite
        run: python evals/run_evals.py

      - name: Build Release Archive (triz-universal.zip)
        run: python scripts/sync_deployment.py --package-zip

      - name: Upload Skill Package Artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: triz-universal-package
          path: dist/*.zip
